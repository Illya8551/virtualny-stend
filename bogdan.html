      if (n < 1 || n > 33) return;

    function renderHotspots() {
      var c = document.getElementById("hotspots");
      c.innerHTML = "";
      var spots = HOT[String(cur)] || [];
      spots.forEach(function (s) {
        if (s.target == null) return;
        var d = document.createElement("div");
        d.className = "hs";
        d.style.left = (s.x / SW * 100) + "%";
        d.style.top = (s.y / SH * 100) + "%";
        d.style.width = (s.cx / SW * 100) + "%";
        d.style.height = (s.cy / SH * 100) + "%";
        d.title = s.label || "";
        d.onclick = function () { showSlide(s.target); };
        c.appendChild(d);
      });
    }

      if (e.key === "ArrowRight") showSlide(cur + 1);
      if (e.key === "ArrowLeft") showSlide(cur - 1);
    });
